monolog:
    channels:
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists

when@dev:
    monolog:
        handlers:
            main:
                type: rotating_file
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event"]
            nested:
                type: rotating_file
                path: "%kernel.logs_dir%/%kernel.environment%-request.log"
                level: notice
                channels: [ "!event" ]
            # uncomment to get logging in your browser
            # you may have to allow bigger header sizes in your Web server configuration
            #firephp:
            #    type: firephp
            #    level: info
            #chromephp:
            #    type: chromephp
            #    level: info
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]

when@staging:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
            nested:
                type: rotating_file
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
            notice:
                type: rotating_file
                path: "%kernel.logs_dir%/%kernel.environment%-request.log"
                level: notice
                channels: [ "!event" ]

when@prod:
    monolog:
        handlers:
            main:
                type: rotating_file
                path: '%kernel.logs_dir%/prod.log'
                level: error
                channels: ["!event"]
                formatter: monolog.formatter.json
                max_files: 10
            critical:
                type: rotating_file
                path: '%kernel.logs_dir%/prod-critical.log'
                level: critical
                channels: ["!event"]
                formatter: monolog.formatter.json
                max_files: 10
            error:
                type: rotating_file
                path: '%kernel.logs_dir%/prod-error.log'
                level: error
                channels: ["!event"]
                formatter: monolog.formatter.json
                max_files: 10
            warning:
                type: rotating_file
                path: '%kernel.logs_dir%/prod-warning.log'
                level: warning
                channels: ["!event"]
                formatter: monolog.formatter.json
                max_files: 5
            notice:
                type: rotating_file
                path: "%kernel.logs_dir%/%kernel.environment%-request.log"
                level: notice
                channels: ["!event"]
                formatter: monolog.formatter.json
                max_files: 5
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine"]
                level: error
